<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Palak ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffd1ff);
background-size:400% 400%;
animation:bg 10s infinite alternate;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.card{
width:90%;
max-width:450px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.2);
position:relative;
z-index:10;
}

h1{
font-size:32px;
color:#fff;
margin-bottom:15px;
}

p{
font-size:22px;
color:#fff;
margin-bottom:35px;
line-height:1.5;
font-weight:bold;
}

button{
padding:14px 32px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.25s;
}

#yes{
background:#4CAF50;
color:white;
margin-right:15px;
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:#ff3b30;
color:white;
position:fixed;
}

#message{
display:none;
margin-top:25px;
font-size:24px;
font-weight:bold;
color:#fff;
animation:pop .6s;
}

@keyframes pop{
from{
transform:scale(.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.emoji{
position:absolute;
font-size:25px;
animation:fly linear infinite;
pointer-events:none;
}

@keyframes fly{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{opacity:1;}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<h1>💖 Dear Palak 💖</h1>

<p>
Will you be my sister<br>
in the next life too? 🥹❤️
</p>

<button id="yes">Yes ❤️</button>

<div id="message">
🥹❤️ Thank You, Palak! ❤️🥹<br><br>
No matter how many lives we get,<br>
I will always be grateful to have a sister like you. 🌸
</div>

</div>

<button id="no">No 😅</button>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");

no.style.left="60%";
no.style.top="60%";

function moveButton(){

let x=Math.random()*(window.innerWidth-110);
let y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";
no.style.top=y+"px";

}

no.addEventListener("mouseover",moveButton);
no.addEventListener("click",moveButton);
no.addEventListener("touchstart",moveButton);

yes.onclick=function(){

document.getElementById("message").style.display="block";

no.style.display="none";

for(let i=0;i<120;i++){

let e=document.createElement("div");

e.className="emoji";

const arr=["❤️","🌸","✨","🎀","💖","🥹"];

e.innerHTML=arr[Math.floor(Math.random()*arr.length)];

e.style.left=Math.random()*100+"vw";

e.style.animationDuration=(Math.random()*5+4)+"s";

e.style.fontSize=(18+Math.random()*22)+"px";

document.body.appendChild(e);

setTimeout(()=>{
e.remove();
},9000);

}

}

</script>

</body>
</html>
