<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Raksha Bandhan - Dear Palak 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            background-size: 200% 200%;
            animation: bgMove 8s ease infinite alternate;
        }

        @keyframes bgMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #floating-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .float-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp 6s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
        }

        /* MAIN CARD */
        .card-container {
            position: relative;
            z-index: 10;
            width: 88vw;
            max-width: 340px;
            padding: 22px 18px;
            text-align: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .photo-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 12px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffd700, #ff69b4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        h1.heading {
            font-size: 1.35rem;
            color: #d81b60;
            margin-bottom: 2px;
            font-weight: 800;
        }

        h2.subheading {
            font-size: 0.95rem;
            color: #b76e79;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.question {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            min-height: 48px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            touch-action: manipulation;
        }

        .btn-yes {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-no {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            position: relative;
            z-index: 99;
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        /* STEP 2: RAKHI SCREEN */
        .rakhi-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0;
        }

        .hand-container {
            position: relative;
            width: 160px;
            height: 140px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hand-emoji {
            font-size: 5.5rem;
            position: absolute;
            bottom: 0;
        }

        .rakhi-emoji {
            font-size: 3.5rem;
            position: absolute;
            top: -15px;
            cursor: pointer;
            filter: drop-shadow(0 4px 10px rgba(255, 105, 180, 0.6));
            animation: bounceRakhi 1.2s ease-in-out infinite alternate;
            z-index: 30;
            touch-action: manipulation;
        }

        @keyframes bounceRakhi {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-12px) scale(1.1); }
        }

        .rakhi-emoji.tied {
            animation: tieRakhiAnim 0.7s forwards !important;
        }

        @keyframes tieRakhiAnim {
            0% { top: -15px; transform: scale(1.2); }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { top: 35px; transform: scale(1.1) rotate(360deg); }
        }

        .tap-instruction {
            font-size: 1rem;
            color: #d81b60;
            font-weight: 800;
            margin-top: 10px;
            animation: pulseText 0.8s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.04); }
        }

        .message-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            border: 1.5px solid #ffd700;
            font-size: 0.9rem;
            color: #c2185b;
            font-weight: 700;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    <div id="floating-layer"></div>

    <div class="card-container" id="card">
        <!-- Main Question Screen -->
        <div id="initialView" style="width: 100%;">
            <div class="photo-wrapper" style="margin: 0 auto 12px auto;">
                <img src="palak.jpg" alt="Palak" class="profile-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';">
            </div>

            <h1 class="heading">💖 Dear Palak 💖</h1>
            <h2 class="subheading">Happy Raksha Bandhan 🌸</h2>
            <p class="question">Will you be my sister in the next life too? 🥹❤️</p>

            <div class="btn-wrapper" id="btnGroup">
                <button class="btn btn-yes" id="yesBtn">YES</button>
                <button class="btn btn-no" id="noBtn">NO</button>
            </div>
        </div>

        <!-- Interactive Rakhi Screen -->
        <div class="rakhi-section" id="rakhiSection">
            <h1 class="heading">🌸 Rakhi Time 🌸</h1>
            <div class="hand-container" id="rakhiClickArea">
                <span class="rakhi-emoji" id="rakhiIcon">🏵️</span>
                <span class="hand-emoji">🤚</span>
            </div>
            <p class="tap-instruction" id="tapInstruction">✨ Tap Rakhi to Tie ✨</p>
        </div>

        <!-- Final Message Screen -->
        <div class="message-box" id="msgBox"></div>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-piano-112180.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Floating Emojis Background
        const floatLayer = document.getElementById('floating-layer');
        const icons = ['💖', '🌸', '✨', '💕', '🌺', '🏵️'];
        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'float-item';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 90 + '%';
            floatLayer.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }, 400);

        // NO BUTTON DODGE LOGIC
        const noBtn = document.getElementById('noBtn');
        let isNoBtnMoved = false;

        function dodgeNoBtn(e) {
            if (e) e.preventDefault();
            
            if (!isNoBtnMoved) {
                noBtn.style.position = 'fixed';
                isNoBtnMoved = true;
            }

            const btnWidth = noBtn.offsetWidth || 80;
            const btnHeight = noBtn.offsetHeight || 40;
            const padding = 20;

            const maxLeft = window.innerWidth - btnWidth - padding;
            const maxTop = window.innerHeight - btnHeight - padding;

            const randomLeft = Math.max(padding, Math.floor(Math.random() * maxLeft));
            const randomTop = Math.max(padding, Math.floor(Math.random() * maxTop));

            noBtn.style.left = randomLeft + 'px';
            noBtn.style.top = randomTop + 'px';
        }

        noBtn.addEventListener('touchstart', dodgeNoBtn);
        noBtn.addEventListener('click', dodgeNoBtn);
        noBtn.addEventListener('mouseover', dodgeNoBtn);

        // YES BUTTON -> OPEN RAKHI SCREEN
        const yesBtn = document.getElementById('yesBtn');
        const initialView = document.getElementById('initialView');
        const rakhiSection = document.getElementById('rakhiSection');
        const bgAudio = document.getElementById('bgAudio');

        function openRakhiScreen(e) {
            if (e) e.preventDefault();
            
            bgAudio.play().catch(() => {});
            
            initialView.style.display = 'none';
            noBtn.style.display = 'none';
            rakhiSection.style.display = 'flex';
        }

        yesBtn.addEventListener('touchstart', openRakhiScreen);
        yesBtn.addEventListener('click', openRakhiScreen);

        // TAP RAKHI TO TIE -> SHOW FINAL CELEBRATION
        const rakhiIcon = document.getElementById('rakhiIcon');
        const rakhiClickArea = document.getElementById('rakhiClickArea');
        const tapInstruction = document.getElementById('tapInstruction');
        const msgBox = document.getElementById('msgBox');
        let isTied = false;

        function handleTieRakhi(e) {
            if (e) e.preventDefault();
            if (isTied) return;
            isTied = true;

            rakhiIcon.classList.add('tied');
            tapInstruction.innerText = "❤️ Rakhi Tied! ❤️";

            startFireworks();

            setTimeout(() => {
                rakhiSection.style.display = 'none';
                msgBox.style.display = 'block';
                msgBox.innerHTML = "Thank you, Palak ❤️<br><br>I would choose you as my sister in every lifetime.<br><br>Happy Raksha Bandhan 🌸<br>You are the best sister ever!";
            }, 1000);
        }

        rakhiIcon.addEventListener('touchstart', handleTieRakhi);
        rakhiIcon.addEventListener('click', handleTieRakhi);
        rakhiClickArea.addEventListener('click', handleTieRakhi);

        // Canvas Fireworks
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        function startFireworks() {
            setInterval(() => {
                for(let i = 0; i < 35; i++) {
                    particles.push({
                        x: window.innerWidth / 2,
                        y: window.innerHeight / 2,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                        alpha: 1
                    });
                }
            }, 300);
            animateCanvas();
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                if(p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateCanvas);
        }
    </script>
</body>
</html>
