<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Raksha Bandhan - Dear Palak 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            background-size: 200% 200%;
            animation: bgMove 8s ease infinite alternate;
        }

        @keyframes bgMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #floating-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .float-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp 6s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
        }

        /* MAIN CARD */
        .card-container {
            position: relative;
            z-index: 10;
            width: 88vw;
            max-width: 340px;
            padding: 22px 18px;
            text-align: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .photo-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 12px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffd700, #ff69b4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        h1.heading {
            font-size: 1.35rem;
            color: #d81b60;
            margin-bottom: 2px;
            font-weight: 800;
        }

        h2.subheading {
            font-size: 0.95rem;
            color: #b76e79;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.question {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            min-height: 48px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            touch-action: manipulation;
        }

        .btn-yes {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        /* NO BUTTON - FIXED IN BOUNDS */
        .btn-no {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            position: relative;
            z-index: 99;
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        /* STEP 2: RAKHI TYING SECTION */
        .rakhi-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .hand-container {
            position: relative;
            width: 150px;
            height: 130px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hand-emoji {
            font-size: 5rem;
            position: absolute;
            bottom: 0;
            transform: rotate(-10deg);
            transition: transform 0.3s ease;
        }

        .rakhi-emoji {
            font-size: 3.2rem;
            position: absolute;
            top: -10px;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(255, 105, 180, 0.5));
            animation: floatRakhi 1.5s ease-in-out infinite alternate;
            z-index: 30;
            touch-action: manipulation;
        }

        @keyframes floatRakhi {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.08); }
        }

        .rakhi-emoji.tied {
            animation: tieRakhiAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
        }

        @keyframes tieRakhiAnim {
            0% { top: -10px; transform: scale(1.2) rotate(0deg); }
            50% { transform: scale(1.4) rotate(180deg); }
            100% { top: 40px; transform: scale(1.1) rotate(360deg); }
        }

        .tap-instruction {
            font-size: 0.95rem;
            color: #d81b60;
            font-weight: 800;
            margin-top: 10px;
            animation: pulseText 1s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* FINAL MESSAGE BOX */
        .message-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            border: 1.5px solid #ffd700;
            font-size: 0.88rem;
            color: #c2185b;
            font-weight: 700;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    <div id="floating-layer"></div>

    <div class="card-container" id="card">
        <!-- Initial View -->
        <div id="initialView" style="width: 100%;">
            <div class="photo-wrapper" style="margin: 0 auto 12px auto;">
                <img src="palak.jpg" alt="Palak" class="profile-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';">
            </div>

            <h1 class="heading">💖 Dear Palak 💖</h1>
            <h2 class="subheading">Happy Raksha Bandhan 🌸</h2>
            <p class="question">Will you be my sister in the next life too? 🥹❤️</p>

            <div class="btn-wrapper" id="btnGroup">
                <button class="btn btn-yes" id="yesBtn">YES</button>
                <button class="btn btn-no" id="noBtn">NO</button>
            </div>
        </div>

        <!-- Step 2: Interactive Rakhi Tying -->
        <div class="rakhi-section" id="rakhiSection">
            <h1 class="heading">🌸 Tie The Rakhi 🌸</h1>
            <div class="hand-container">
                <span class="rakhi-emoji" id="rakhiIcon">🏵️</span>
                <span class="hand-emoji" id="handIcon">🖐️</span>
            </div>
            <p class="tap-instruction" id="tapInstruction">✨ Tap to tie rakhi ✨</p>
        </div>

        <!-- Step 3: Final Celebration Message -->
        <div class="message-box" id="msgBox"></div>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-piano-112180.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Floating Emojis Background
        const floatLayer = document.getElementById('floating-layer');
        const icons = ['💖', '🌸', '✨', '💕', '🌺', '🏵️'];
        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'float-item';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 90 + '%';
            floatLayer.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }, 400);

        // PERFECT NO BUTTON DODGE (STAYS IN SCREEN BOUNDS ALWAYS)
        const noBtn = document.getElementById('noBtn');
        let isNoBtnMoved = false;

        function dodgeNoBtn(e) {
            if (e) e.preventDefault();
            
            if (!isNoBtnMoved) {
                noBtn.style.position = 'fixed';
                isNoBtnMoved = true;
            }

            const btnWidth = noBtn.offsetWidth || 80;
            const btnHeight = noBtn.offsetHeight || 40;
            const padding = 20;

            // Strict Visible Screen Bounds
            const maxLeft = window.innerWidth - btnWidth - padding;
            const maxTop = window.innerHeight - btnHeight - padding;

            const randomLeft = Math.max(padding, Math.floor(Math.random() * maxLeft));
            const randomTop = Math.max(padding, Math.floor(Math.random() * maxTop));

            noBtn.style.left = randomLeft + 'px';
            noBtn.style.top = randomTop + 'px';
        }

        noBtn.addEventListener('touchstart', dodgeNoBtn);
        noBtn.addEventListener('click', dodgeNoBtn);
        noBtn.addEventListener('mouseover', dodgeNoBtn);

        // FLOW STEP 1: YES CLICK -> SHOW RAKHI SECTION
        const yesBtn = document.getElementById('yesBtn');
        const initialView = document.getElementById('initialView');
        const rakhiSection = document.getElementById('rakhiSection');
        const bgAudio = document.getElementById('bgAudio');

        function goToRakhiSection(e) {
            if (e) e.preventDefault();
            
            bgAudio.play().catch(() => {});
            
            // Hide Initial View & NO button completely
            initialView.style.display = 'none';
            noBtn.style.display = 'none';

            // Show Rakhi Section
            rakhiSection.style.display = 'flex';
        }

        yesBtn.addEventListener('touchstart', goToRakhiSection);
        yesBtn.addEventListener('click', goToRakhiSection);

        // FLOW STEP 2: TAP TO TIE RAKHI -> FINAL CELEBRATION
        const rakhiIcon = document.getElementById('rakhiIcon');
        const tapInstruction = document.getElementById('tapInstruction');
        const msgBox = document.getElementById('msgBox');
        let isRakhiTied = false;

        function tieRakhi(e) {
            if (e) e.preventDefault();
            if (isRakhiTied) return;
            isRakhiTied = true;

            // Trigger Animation
            rakhiIcon.classList.add('tied');
            tapInstruction.innerText = "❤️ Rakhi Tied Successfully! ❤️";

            // Fire Canvas Celebration
            startFireworks();

            // Transition to Final Celebration Page after 1.2 Seconds
            setTimeout(() => {
                rakhiSection.style.display = 'none';
                msgBox.style.display = 'block';
                msgBox.innerHTML = "Thank you, Palak ❤️<br><br>I would choose you as my sister in every lifetime.<br><br> Happy Raksha Bandhan 🌸<br> You're the best sister ever!";
            }, 1200);
        }

        rakhiIcon.addEventListener('touchstart', tieRakhi);
        rakhiIcon.addEventListener('click', tieRakhi);

        // Canvas Fireworks
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        function startFireworks() {
            setInterval(() => {
                for(let i = 0; i < 35; i++) {
                    particles.push({
                        x: window.innerWidth / 2,
                        y: window.innerHeight / 2,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                        alpha: 1
                    });
                }
            }, 300);
            animateCanvas();
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                if(p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateCanvas);
        }
    </script>
</body>
</html>
