<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Raksha Bandhan - Dear Palak 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            background-size: 200% 200%;
            animation: bgMove 8s ease infinite alternate;
        }

        @keyframes bgMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #floating-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .float-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp 6s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
        }

        /* CARD - Fits strictly on all screens */
        .card-container {
            position: relative;
            z-index: 10;
            width: 88vw;
            max-width: 340px;
            max-height: 90vh;
            padding: 20px 16px;
            text-align: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .photo-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 12px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffd700, #ff69b4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        h1.heading {
            font-size: 1.35rem;
            color: #d81b60;
            margin-bottom: 2px;
            font-weight: 800;
        }

        h2.subheading {
            font-size: 0.95rem;
            color: #b76e79;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.question {
            font-size: 0.88rem;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            min-height: 50px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            touch-action: manipulation;
        }

        .btn-yes {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-no {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            position: relative;
            transition: transform 0.1s ease;
        }

        .message-box {
            display: none;
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            border: 1px solid #ffd700;
            font-size: 0.85rem;
            color: #c2185b;
            font-weight: 700;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    <div id="floating-layer"></div>

    <div class="card-container" id="card">
        <div class="photo-wrapper">
            <img src="palak.jpg" alt="Palak" class="profile-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';">
        </div>

        <h1 class="heading">💖 Dear Palak 💖</h1>
        <h2 class="subheading">Happy Raksha Bandhan 🌸</h2>
        <p class="question">Will you be my sister in the next life too? 🥹❤️</p>

        <div class="btn-wrapper" id="btnGroup">
            <button class="btn btn-yes" id="yesBtn">YES</button>
            <button class="btn btn-no" id="noBtn">NO</button>
        </div>

        <div class="message-box" id="msgBox"></div>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-piano-112180.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Floating Emojis
        const floatLayer = document.getElementById('floating-layer');
        const icons = ['💖', '🌸', '✨', '💕', '🌺'];
        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'float-item';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 90 + '%';
            floatLayer.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }, 400);

        // Dodge NO Button safely within viewport
        const noBtn = document.getElementById('noBtn');
        function moveNoBtn(e) {
            if (e) e.preventDefault();
            noBtn.style.position = 'fixed';
            
            const btnW = noBtn.offsetWidth || 70;
            const btnH = noBtn.offsetHeight || 35;
            
            const maxX = window.innerWidth - btnW - 20;
            const maxY = window.innerHeight - btnH - 20;

            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('touchstart', moveNoBtn);
        noBtn.addEventListener('mouseover', moveNoBtn);

        // YES Button Click Action
        const yesBtn = document.getElementById('yesBtn');
        const msgBox = document.getElementById('msgBox');
        const btnGroup = document.getElementById('btnGroup');
        const bgAudio = document.getElementById('bgAudio');

        function handleYesAction(e) {
            if(e) e.preventDefault();
            bgAudio.play().catch(() => {});
            
            btnGroup.style.display = 'none';
            noBtn.style.display = 'none';
            
            msgBox.style.display = 'block';
            msgBox.innerHTML = "Thank you, Palak ❤️<br>I would choose you as my sister in every lifetime.<br>Happy Raksha Bandhan 🌸";
            
            startFireworks();
        }

        yesBtn.addEventListener('touchstart', handleYesAction);
        yesBtn.addEventListener('click', handleYesAction);

        // Simple Fireworks Canvas
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        function startFireworks() {
            setInterval(() => {
                for(let i=0; i<30; i++) {
                    particles.push({
                        x: window.innerWidth / 2,
                        y: window.innerHeight / 2,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        color: `hsl(${Math.random()*360}, 100%, 60%)`,
                        alpha: 1
                    });
                }
            }, 300);
            animateCanvas();
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
                if(p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateCanvas);
        }
    </script>
</body>
</html>
